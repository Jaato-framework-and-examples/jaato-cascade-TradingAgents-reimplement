# Tier-1 base for the 'research_manager' stage — PROVIDER-AGNOSTIC.
# Holds stage determinism (plugins, schemas, gates, ceilings).
# Provider + model live in profiles/<set>/research_manager.yaml, selected by JAATO_PROFILE_SET.
name: _base_research_manager
description: judge of the investment debate; emits the research plan.
plugins: []
max_turns: 6
spawn_payload_schema:
  type: object
  additionalProperties: false
  required:
  - ticker
  - instrument_context
  - trade_date
  - asset_type
  properties:
    ticker:
      type: string
    instrument_context:
      type: string
    trade_date:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
    asset_type:
      type: string
      enum:
      - stock
      - crypto
completion_payload_schema: completion_schemas/research_plan.json
