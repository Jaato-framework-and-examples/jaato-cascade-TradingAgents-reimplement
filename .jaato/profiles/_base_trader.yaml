# Tier-1 base for the 'trader' stage — PROVIDER-AGNOSTIC.
# Holds stage determinism (plugins, schemas, gates, ceilings).
# Provider + model live in profiles/<set>/trader.yaml, selected by JAATO_PROFILE_SET.
name: _base_trader
description: turns the research plan into a trade proposal.
# The binding rules this stage must satisfy reach it as references, not as
# persona prose: they are versioned, citable, and each has a conformance
# check under knowledge/checks/.
#
# MEASURED 2026-10-03: selecting a reference (and `preselected`) only makes it
# AVAILABLE — it authorises readonly access to the reference's path.  Nothing
# is injected, under any mode: a probe token placed in the rule body was never
# echoed by the trader under `selectable` or under `auto`.  So the stage needs
# readFile to open what it selected, AND the persona must tell it to look:
# an unread rule binds nothing.  The persona is the index, the catalogue is
# the content.
plugins:
- references(preload, tools:[listReferences, selectReferences])
- file_edit(preload, tools:[readFile])
plugin_configs:
  references:
    preselected: [stop-placement]
  permission:
    # A headless run must never wait on an approval prompt (CLAUDE.md, host tools).
    policy:
      whitelist:
        tools: [readFile, listReferences, selectReferences]
budget_control:
  # Judge: 1 signal_completion observed, but field-by-field completion can take ~15 calls; 17-81 s.
  # Sizing and mechanics: docs/gaps.md #15.
  limits: {tool_calls: 30, usd: 1.5, seconds: 480, turns: 6}
  degrade: [{at: 100, action: abort}]
spawn_payload_schema:
  type: object
  additionalProperties: false
  required:
  - ticker
  - instrument_context
  - trade_date
  - asset_type
  properties:
    ticker:
      type: string
    instrument_context:
      type: string
    trade_date:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
    asset_type:
      type: string
      enum:
      - stock
      - crypto
completion_payload_schema: completion_schemas/trader_proposal.json
completion_processors:
- script: scripts/processors/rules_read.py
  name: rules_read
  max_refusals: 2
  on_exhausted: allow
- script: scripts/processors/price_fields.py
  name: price_fields
  max_refusals: 2
  on_exhausted: allow
  output: results/{ticker}/{trade_date}/live/3_trading/proposal.md
