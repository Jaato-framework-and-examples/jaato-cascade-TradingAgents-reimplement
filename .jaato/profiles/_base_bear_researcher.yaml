# Tier-1 base for the 'bear_researcher' stage — PROVIDER-AGNOSTIC.
# Holds stage determinism (plugins, schemas, gates, ceilings).
# Provider + model live in profiles/<set>/bear_researcher.yaml, selected by JAATO_PROFILE_SET.
name: _base_bear_researcher
description: 'bear side of the investment debate: plain turns, no completion gate.'
# The attribution rule reaches this stage as a reference. Selecting one only
# authorises its PATH, so readFile is needed to open it and the persona must
# say to look (measured 2026-10-03, docs/gaps.md). Unenforced here: a debater
# runs as plain turns with no completion payload, so no gate inspects it — the
# research manager catches violations downstream, which is how this rule was
# found in the first place.
plugins:
- references(preload, tools:[listReferences, selectReferences])
- file_edit(preload, tools:[readFile])
plugin_configs:
  references:
    preselected: [claims-must-match-the-source]
  permission:
    policy:
      whitelist:
        tools: [readFile, listReferences, selectReferences]
budget_control:
  # Debater: no tool calls observed; the costliest stage measured was a risk debater, $0.63 over 8 calls.
  # Sizing and mechanics: docs/gaps.md #15.
  limits: {tool_calls: 10, usd: 2.0, seconds: 600, turns: 12}
  degrade: [{at: 100, action: abort}]
suppress_base_instructions:
  constants: true
spawn_payload_schema:
  type: object
  additionalProperties: false
  required:
  - ticker
  - instrument_context
  - trade_date
  - asset_type
  properties:
    ticker:
      type: string
    instrument_context:
      type: string
    trade_date:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
    asset_type:
      type: string
      enum:
      - stock
      - crypto
