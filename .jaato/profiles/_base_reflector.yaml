# Tier-1 base for the 'reflector' stage — PROVIDER-AGNOSTIC.
# Holds stage determinism (plugins, schemas, gates, ceilings).
# Provider + model live in profiles/<set>/reflector.yaml, selected by JAATO_PROFILE_SET.
name: _base_reflector
description: scores a past decision against its realised outcome.
plugins: []
budget_control:
  # Judge: 1 signal_completion observed, but field-by-field completion can take ~15 calls; 17-81 s.
  # Sizing and mechanics: docs/gaps.md #15.
  limits: {tool_calls: 30, usd: 1.5, seconds: 480, turns: 4}
  degrade: [{at: 100, action: abort}]
spawn_payload_schema:
  type: object
  additionalProperties: false
  required:
  - ticker
  - trade_date
  properties:
    ticker:
      type: string
    trade_date:
      type: string
completion_payload_schema: completion_schemas/reflection.json
