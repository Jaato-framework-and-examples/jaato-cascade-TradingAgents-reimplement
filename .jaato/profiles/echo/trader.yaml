# trader — echo set: deterministic test double, no credentials, no network.
name: trader
description: turns the research plan into a trade proposal.
inherits:
- _base_trader
# The echo double cannot satisfy `rules_read`: that gate requires the session
# to have called readFile on its binding rules, and echo scripts exactly ONE
# tool call, already spent on signal_completion (CLAUDE.md trap: "one call then
# text is all it does").  Refusing its completion sends it back to do something
# it cannot do, so the nudges exhaust and the stage fails with NudgeExhausted —
# `on_exhausted: allow` does not help, because the failure is not exhausted
# refusals.  Declining the gate here keeps the double honest about what it can
# simulate; a gate that needs a real tool loop is not echo-testable.
suppress_inherited_processors:
- rules_read
plugins: []
model: echo
provider: echo
plugin_configs:
  echo:
    usage:
      prompt_tokens: 1000
      output_tokens: 200
    tool_call:
      name: signal_completion
      args:
        action: Buy
        reasoning: 'echo: follows the plan.'
        entry_price: 100.0
        stop_loss: 92.0
        position_sizing: 'echo: half size'
        errors: []
        warnings: []
env:
  TA_CASCADE_PREFETCH: 'off'
