# Tier-1 base for the 'bull_researcher' stage — PROVIDER-AGNOSTIC.
# Holds stage determinism (plugins, schemas, gates, ceilings).
# Provider + model live in profiles/<set>/bull_researcher.yaml, selected by JAATO_PROFILE_SET.
name: _base_bull_researcher
description: 'bull side of the investment debate: plain turns, no completion gate.'
plugins: []
budget_control:
  # Debater: no tool calls observed; the costliest stage measured was a risk debater, $0.63 over 8 calls.
  # Sizing and mechanics: docs/gaps.md #15.
  limits: {tool_calls: 10, usd: 2.0, seconds: 600, turns: 12}
  degrade: [{at: 100, action: abort}]
suppress_base_instructions:
  constants: true
spawn_payload_schema:
  type: object
  additionalProperties: false
  required:
  - ticker
  - instrument_context
  - trade_date
  - asset_type
  properties:
    ticker:
      type: string
    instrument_context:
      type: string
    trade_date:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
    asset_type:
      type: string
      enum:
      - stock
      - crypto
