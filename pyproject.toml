[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-cascade"
version = "0.1.0"
description = "A TradingAgents-shaped analysis pipeline reimplemented as a jaato cascade"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jaato-sdk",
    "pandas>=2.0",
    "yfinance>=0.2.50",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ta-cascade = "ta_cascade.cli:main"

[tool.setuptools.packages.find]
include = ["ta_cascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "daemon: starts a jaato daemon on a private socket (slow, needs jaato-server importable)",
]
